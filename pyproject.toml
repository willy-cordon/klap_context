[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klapcontext"
dynamic = ["version"]
description = "Make your repository understandable to humans and AI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Willy Cordon"}]
keywords = ["codebase", "developer-tools", "engineering-context", "graphify", "ai-agents"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Documentation"]
dependencies = ["graphifyy>=0.9.66", "tree-sitter>=0.24,<0.26", "tree-sitter-php>=0.24,<0.25", "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.26"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=6"]

[project.urls]
Homepage = "https://github.com/willy-cordon/klap_context"
Repository = "https://github.com/willy-cordon/klap_context"
Issues = "https://github.com/willy-cordon/klap_context/issues"

[project.scripts]
klap = "klapcontext.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "klapcontext.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
