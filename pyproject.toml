[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klapcontext"
version = "0.1.0"
description = "Make your repository understandable to humans and AI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "KlapContext contributors"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.scripts]
klap = "klapcontext.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
